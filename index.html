<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>97neko75</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf9fc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 48px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1e2a5e;
            margin-bottom: 0.5rem;
        }

        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.9rem;
            margin: 1.5rem 0 0.5rem;
        }

        .social-links a {
            background: #f4f3f9;
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            text-decoration: none;
            color: #1e2a5e;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .social-links a:hover {
            background: #1e2a5e;
            color: white;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: #8b89a3;
            border-top: 1px solid #eceaf2;
            padding-top: 1rem;
        }
    </style>
