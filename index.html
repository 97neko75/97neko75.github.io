<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>97neko75</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf9fc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1rem;
            color: #1a1a2e;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 48px;
            padding: 2rem 1.8rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0eef5;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #1e2a5e;
            margin-bottom: 0.5rem;
        }

        .social-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.9rem;
            margin: 1.2rem 0 0.8rem;
        }

        .social-links a {
            background: #f4f3f9;
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            text-decoration: none;
            color: #1e2a5e;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.2s;
        }

        .social-links a:hover {
            background: #1e2a5e;
            color: white;
        }

        .blog-section {
            margin-top: 1.5rem;
        }

        .blog-entry {
            border-top: 1px solid #eceaf2;
            padding: 1.2rem 0;
        }

        .blog-entry:first-child {
            border-top: none;
            padding-top: 0;
        }

        .blog-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e2a5e;
            margin-bottom: 0.3rem;
        }

        .blog-date {
            font-size: 0.8rem;
            color: #8b89a3;
            margin-bottom: 0.6rem;
            display: inline-block;
        }

        .blog-summary {
            color: #4a4a6a;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: #8b89a3;
            padding-top: 1rem;
            border-top: 1px solid #eceaf2;
            margin-top: 2rem;
        }

        @media (max-width: 550px) {
            .card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            .blog-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">

<div class="card">
